name: Front client

on:
  push:
    branches: [main]
    paths:
      - 'apps/client/**'
      - 'packages/api-types/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/client.yml'
  pull_request:
    paths:
      - 'apps/client/**'
      - 'packages/api-types/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/client.yml'

jobs:
  build:
    name: Typecheck et build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Types du contrat API
        run: npm run api:types

      - name: Typecheck
        run: npm run typecheck -w @crm-event/client

      - name: Build
        run: npm run build -w @crm-event/client
        env:
          VITE_API_URL: http://localhost:8000
