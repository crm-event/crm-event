name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tests, style et build front
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Doit correspondre à la contrainte de composer.json ("php": "^8.3")
      # et au PHP utilisé par l'équipe en local.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3, pdo_mysql
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}

      - run: composer install --no-interaction --prefer-dist --no-progress

      - name: Préparer l'environnement
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Style (Pint)
        run: vendor/bin/pint --test

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Le build doit exister avant les tests : les pages Inertia sont rendues
      # via le manifeste de Vite.
      - name: Build front (Vite + Inertia)
        run: npm run build

      - name: Tests (sqlite en mémoire)
        run: php artisan test
